[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tddt"
version = "2.0.0.dev0"
description = "Total Domain Discovery Tool — modular EASM + user OSINT framework"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "Lambru", email = "latiniludovico@gmail.com" }]
keywords = ["osint", "easm", "recon", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31",
    "requests-cache>=1.2",
    "urllib3>=2.0",
    "dnspython>=2.5",
    "beautifulsoup4>=4.12",
    "rich>=13.7",
    "mmh3>=4.1",
    "python-dotenv>=1.0",
    "phonenumbers>=8.13",
    "holehe>=1.60",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
urldna = ["urldna"]
dev = [
    "pytest>=8.0",
    "pytest-vcr>=1.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
tddt = "tddt.cli:main"

[project.urls]
Repository = "https://github.com/Lambru99/TDDT"

[tool.setuptools.packages.find]
include = ["tddt*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
tddt = ["data/*.json", "data/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PLE"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM", "PLE"]

[tool.mypy]
strict = true
files = "tddt/core"
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "active: tests that make outbound network connections (skipped in CI)",
]
addopts = "-ra --strict-markers --import-mode=importlib"
